max_connections = 200
listen_addresses = '*'

shared_buffers = 2GB
work_mem = 32MB
maintenance_work_mem = 512MB
effective_cache_size = 8GB

wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 8GB
min_wal_size = 1GB

log_min_duration_statement = 200ms
log_checkpoints = on
log_connections = on
log_disconnections = on
