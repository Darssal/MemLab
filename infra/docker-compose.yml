services:
  redis:
    image: redis:8.6.1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER locally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB locally}
      TZ: UTC
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.0
    environment:
      RUN_MODE: production
    volumes:
      - qdrant_data:/qdrant/storage
      - ../configs/qdrant/production.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || grep -q ':18BD' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redis_data:
    name: memlab_redis_data
  postgres_data:
    name: memlab_postgres_data
  qdrant_data:
    name: memlab_qdrant_data
